    * {
      box-sizing: border-box;

      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;

    /* Papan Kayu Asli (Carved Wood Texture) */
    .wood-board {
      background: linear-gradient(180deg, #9a6538 0%, #78451f 50%, #542b10 100%);
      border: 4px solid #361705;
      border-radius: 20px;
      box-shadow: 
        inset 0 3px 5px rgba(255, 255, 255, 0.35),
        inset 0 -4px 6px rgba(0, 0, 0, 0.65),

    .wood-board::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 12px;
      right: 12px;
      height: 2px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 9999px;
      pointer-events: none;
    }

    /* Butang Papan Kayu Interaktif */
    .wood-btn {
      background: linear-gradient(180deg, #b07d4b 0%, #8c572b 50%, #683916 100%);
      border: 3px solid #361705;
      border-radius: 16px;

        inset 0 2px 3px rgba(255, 255, 255, 0.4),
        0 5px 0 #2c1203,
        0 8px 12px rgba(0,0,0,0.35);
      transition: all 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translateY(0);
      text-shadow: 1px 2px 3px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      cursor: pointer;
    }
    .wood-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 
        inset 0 2px 3px rgba(255, 255, 255, 0.4),
        0 7px 0 #2c1203,
        0 11px 16px rgba(0,0,0,0.4);
    }
    .wood-btn:active {
      transform: translateY(4px);
      box-shadow: 
        inset 0 1px 2px rgba(0, 0, 0, 0.4),
        0 1px 0 #2c1203,
        0 3px 6px rgba(0,0,0,0.3);
    }

    /* Kertas Parasyut / Parchment Paper */
    .parchment {
      background: #fffdf5;
      background-image: radial-gradient(#ecd7b5 8%, transparent 8%);
      background-size: 16px 16px;
      border: 4px solid #9c6c44;
      border-radius: 22px;
      box-shadow: 
        inset 0 0 25px rgba(181, 136, 99, 0.35),
        0 10px 25px rgba(0, 0, 0, 0.35);
    }

    /* Efek Gem Glow & Shimmer */
    .gem-glow {
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.75));
    }
    @keyframes pulseGem {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.6)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(251, 191, 36, 1)); }
    }
    .gem-pulse {
      animation: pulseGem 2.2s infinite ease-in-out;
    }

    /* Animasi Terapung Cikgu Rimba */
    @keyframes floatRimba {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.2deg); }
    }
    .float-rimba {
      animation: floatRimba 3.6s ease-in-out infinite;
    }

    /* Animasi Bintang Muncul */
    @keyframes starPop {
      0% { transform: scale(0.2) rotate(-40deg); opacity: 0; }
      75% { transform: scale(1.25) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .star-pop {
      animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Screen Shake Ringan */
    @keyframes gentleShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 2px); }
      40% { transform: translate(6px, -2px); }
      60% { transform: translate(-4px, -1px); }
      80% { transform: translate(4px, 1px); }
    }
    .shake {
      animation: gentleShake 0.38s ease-in-out;
    }

    /* Canvas Latar Belakang Tropika */
    #ambientCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;

    }

    /* Scrollbar Kemas */

        animation-iteration-count: 1 !important;

  <script>
    /**
     * PROCEDURAL WEB AUDIO ENGINE
     * Synthesizes peaceful jungle exploration melodies, rhythmic chords, ambient flute tones,
     * button clicks, star collection fanfares, chest unlocks, and boss impacts without any external files.
     */
    class ProceduralAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMusicOn = false;
        this.isSfxOn = true;
        this.musicInterval = null;
        this.stepCounter = 0;
        this.melodyNotes = [
          // Pentatonic pleasant jungle adventure sequence (C Major / A Minor Pentatonic)
          261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25
        ];
        this.currentMood = 'peaceful'; // 'peaceful', 'urgent', 'victory'
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMusic() {
        this.initCtx();
        this.isMusicOn = !this.isMusicOn;
        document.getElementById('musicIcon').textContent = this.isMusicOn ? '🎵' : '🔇';
        if (this.isMusicOn) {
          this.startBgm();
        } else {
          this.stopBgm();
        }
        this.playClick();
      }

      toggleSfx() {
        this.isSfxOn = !this.isSfxOn;
        document.getElementById('sfxIcon').textContent = this.isSfxOn ? '🔊' : '🔈';
        if (this.isSfxOn) this.playClick();
      }

      startBgm() {
        if (!this.isMusicOn || this.musicInterval) return;
        this.initCtx();
        if (!this.ctx) return;

        // Loop melodi berirama setiap 360ms
        this.musicInterval = setInterval(() => {
          if (!this.isMusicOn || !this.ctx) return;
          this.stepCounter++;

          const now = this.ctx.currentTime;
          // Bass drone lembut
          if (this.stepCounter % 8 === 0) {
            this.synthTone(130.81, 0.45, 'triangle', 0.05, now);
          }

          // Arpeggio melodi pengembaraan
          const pattern = [0, 2, 4, 3, 5, 4, 2, 1];
          const noteIndex = pattern[this.stepCounter % pattern.length];
          const freq = this.melodyNotes[noteIndex % this.melodyNotes.length];

          // Bunyi seruling lembut
          this.synthTone(freq, 0.3, 'sine', 0.035, now);

          // Pukulan dram kayu lembut
          if (this.stepCounter % 4 === 0) {
            this.synthPercussion(now, 90);
          }
        }, 380);
      }

      stopBgm() {
        if (this.musicInterval) {
          clearInterval(this.musicInterval);
          this.musicInterval = null;
        }
      }

      synthTone(freq, duration, type, vol, time) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + duration);
      }

      synthPercussion(time, pitch) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + 0.12);
        gain.gain.setValueAtTime(0.06, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(time);
        osc.stop(time + 0.12);
      }

      playClick() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.synthTone(360, 0.06, 'triangle', 0.18, now);
      }

      playCorrect() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Major Arpeggio Kemenangan (C5 -> E5 -> G5 -> C6)
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          this.synthTone(f, 0.28, 'sine', 0.16, now + idx * 0.08);
        });
      }

      playWrong() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [240, 190].forEach((f, idx) => {
          this.synthTone(f, 0.18, 'sawtooth', 0.12, now + idx * 0.12);
        });
      }

      playGemPickup() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [880, 1174.66, 1760].forEach((f, idx) => {
          this.synthTone(f, 0.22, 'sine', 0.15, now + idx * 0.06);
        });
      }

      playChestOpen() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [329.63, 392, 523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          this.synthTone(f, 0.35, 'triangle', 0.16, now + idx * 0.07);
        });
      }

      playVictory() {
        if (!this.isSfxOn) return;
        this.initCtx();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 880, 1046.5, 1318.51];
        notes.forEach((f, idx) => {
          this.synthTone(f, 0.45, 'triangle', 0.2, now + idx * 0.11);
        });
      }
    }

    const audioEngine = new ProceduralAudioEngine();
  </script>

  <script>
    /**
     * STATE PENGURUSAN PERMAINAN TERPUSAT
     */
    class AdventureApp {
      constructor() {
        this.score = 0;
        this.gems = 0;
        this.stars = 0;
        this.combo = 1;
        this.maxCombo = 1;
        this.currentZoneIndex = 0;
        this.unlockedZones = ['zone1'];
        this.completedMissions = [];
        this.badges = ['Penjelajah Baharu'];
        this.selectedBbmTab = 'sp';
        this.characterDialogue = 'Hai, penjelajah cilik! Jom kita mulakan pengembaraan mencari Permata Bahasa!';
      }

      init() {
        this.updateHUD();
        this.showScreen('home');
      }

      updateHUD() {
        document.getElementById('navScoreText').textContent = this.score;
        document.getElementById('navGemsText').textContent = this.gems;
      }

      addScore(pts) {
        const added = pts * this.combo;
        this.score += added;
        this.updateHUD();
        return added;
      }

      incrementCombo() {
        this.combo = Math.min(this.combo + 1, 5);
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      }

      resetCombo() {
        this.combo = 1;
      }

      addGems(amount) {
        this.gems += amount;
        this.updateHUD();
        audioEngine.playGemPickup();
      }

      addStars(count) {
        this.stars += count;
        // Buka kawasan baharu berasaskan jumlah bintang terkumpul
        GAME_DATA.zones.forEach(z => {
          if (this.stars >= z.requiredStars && !this.unlockedZones.includes(z.id)) {
            this.unlockedZones.push(z.id);
            this.showCharacterFeedback(`🎉 Tahniah! Kamu berjaya membuka kawasan baharu: ${z.name}!`);
          }
        });
      }

      showCharacterFeedback(text) {
        this.characterDialogue = text;
        const dialogueEl = document.getElementById('rimbaSpeechBox');
        if (dialogueEl) {
          dialogueEl.textContent = text;
          dialogueEl.classList.add('pop-anim');
          setTimeout(() => dialogueEl.classList.remove('pop-anim'), 400);
        }
      }

      showModal(title, icon, message, buttonText, callback) {
        const modal = document.getElementById('rewardModal');
        const content = document.getElementById('rewardModalContent');
        content.innerHTML = `
          <div class="text-5xl my-2 float-rimba">${icon}</div>
          <h3 class="text-2xl font-extrabold text-woodDark mb-1">${title}</h3>
          <p class="text-sm font-kanit text-slate-700 mb-4">${message}</p>
          <button id="modalActionBtn" class="wood-btn w-full py-3 text-base font-bold">
            ${buttonText}
          </button>
        `;
        modal.classList.remove('hidden');
        document.getElementById('modalActionBtn').onclick = () => {
          modal.classList.add('hidden');
          audioEngine.playClick();
          if (callback) callback();
        };
      }

      // Router Antaramuka Skrin
      showScreen(screenId, params = {}) {
        audioEngine.playClick();
        const viewport = document.getElementById('gameViewport');
        viewport.innerHTML = '';

        switch (screenId) {
          case 'home':
            this.renderHomeScreen(viewport);
            break;
          case 'map':
            this.renderMapScreen(viewport);
            break;
          case 'infoBbm':
            this.renderInfoBbmScreen(viewport);
            break;
          case 'manual':
            this.renderManualScreen(viewport);
            break;
          case 'revision':
            this.renderRevisionScreen(viewport);
            break;
          case 'misi1':
            this.renderMisi1(viewport);
            break;
          case 'misi2':
            this.renderMisi2(viewport);
            break;
          case 'misi3':
            this.renderMisi3(viewport);
            break;
          case 'misi4':
            this.renderMisi4(viewport);
            break;
          case 'misi5':
            this.renderMisi5(viewport);
            break;
          case 'misi6':
            this.renderMisi6(viewport);
            break;
          case 'misi7':
            this.renderMisi7(viewport);
            break;
          case 'misi8':
            this.renderMisi8(viewport);
            break;
          case 'misi9':
            this.renderMisi9(viewport);
            break;
          case 'victory':
            this.renderVictoryScreen(viewport);
            break;
          default:
            this.renderHomeScreen(viewport);
        }
      }
    }

    const app = new AdventureApp();
  </script>

        if (selectedCardIndex === null) {

        const currentCard = cards[selectedCardIndex];

        }
      };

      renderView();
    };

    /**
     * MISI 5: DETEKTIF HURUF BESAR (Membetulkan kesalahan huruf kecil pada Kata Nama Khas)
     */
    AdventureApp.prototype.renderMisi5 = function(container) {
      let sIndex = 0;
      const items = GAME_DATA.misi5_sentences;

      const render = () => {
        const item = items[sIndex];
        const fixedWords = {};

        container.innerHTML = `
          <div class="w-full max-w-xl parchment p-4 sm:p-6 shadow-2xl flex flex-col items-center text-center pop-anim">
            <div class="w-full flex items-center justify-between border-b-2 border-woodPlank pb-2 mb-2">

              <span class="text-xs font-kanit font-bold text-amber-800">Kes ${sIndex + 1} / ${items.length}</span>
              <button onclick="app.showScreen('map')" class="text-xs text-blue-700 underline font-bold">Peta ➔</button>
            </div>

            <div class="text-4xl my-1">🔍</div>
            <h3 class="text-lg font-extrabold text-woodDark">DETEKTIF HURUF BESAR</h3>
            <p class="text-xs font-kanit text-slate-700 mb-2">
              Tekan perkataan Kata Nama Khas yang tersilap ditulis dengan huruf kecil untuk membetulkannya:
            </p>

            <!-- Kawasan Ayat Boleh Ditekan -->
            <div class="w-full bg-white p-4 rounded-2xl border-2 border-woodPlank my-2 flex flex-wrap justify-center gap-2">
              ${item.clickableWords.map((w, idx) => `
                <button id="wordBtn_${idx}" onclick="fixWord(${idx}, '${w}')" class="px-2.5 py-1.5 rounded-lg border border-slate-300 font-kanit text-sm sm:text-base font-bold bg-slate-50 hover:bg-amber-100 transition">
                  ${w}
                </button>
              `).join('')}
            </div>

            <div id="m5Msg" class="min-h-[36px] text-xs font-kanit font-bold mt-2 text-slate-700">
              Cari perkataan Kata Nama Khas yang perlu ditukar huruf besar.
            </div>

            <button id="m5Submit" onclick="checkAllFixed()" class="wood-btn w-full py-3 mt-2 text-sm font-bold">
              SEMAK KEPUTUSAN DETEKTIF
            </button>
          </div>
        `;

        window.fixWord = (idx, word) => {
          audioEngine.playClick();
          const btn = document.getElementById(`wordBtn_${idx}`);
          if (item.fixMapping[word]) {
            fixedWords[word] = true;
            btn.textContent = item.fixMapping[word];
            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
          } else {
            btn.classList.add('shake');
            setTimeout(() => btn.classList.remove('shake'), 300);
          }
        };

        window.checkAllFixed = () => {
          const requiredKeys = Object.keys(item.fixMapping);
          const allFound = requiredKeys.every(k => fixedWords[k]);

          if (allFound) {
            audioEngine.playCorrect();
            this.addScore(150);
            this.addGems(3);
            this.showModal('KES BERJAYA DISELESAIKAN!', '🔎⭐', item.explanation, 'SETERUSNYA', () => {
              sIndex++;
              if (sIndex < items.length) {
                render();
              } else {
                this.addStars(3);
                this.badges.push('Detektif Huruf Besar');
                this.showScreen('map');
              }
            });
          } else {
            audioEngine.playWrong();
            document.getElementById('m5Msg').innerHTML = `<span class="text-rose-700">❌ Masih ada Kata Nama Khas yang belum dibetulkan. Ingat, nama orang dan tempat bermula huruf besar!</span>`;
          }
        };
      };

      render();
    };
  </script>

  <script>
    /**
     * MISI 6: CABARAN PANTAS (Speed Challenge dengan Undur Masa 5s)
     */
    AdventureApp.prototype.renderMisi6 = function(container) {
      let pool = [...GAME_DATA.misi6_speedPool].sort(() => Math.random() - 0.5);
      let idx = 0;
      let timer = 5;
      let timerInterval = null;

      const renderQuestion = () => {
        if (idx >= pool.length) {
          clearInterval(timerInterval);
          this.addStars(3);
          this.showModal('CABARAN PANTAS TAMAT!', '⚡⚡', 'Luar biasa tangkas! Anda memperoleh bonus kelajuan!', 'KEMBALI KE PETA', () => {
            this.showScreen('map');
          });
          return;
        }

        const current = pool[idx];
        timer = 5;

        container.innerHTML = `
          <div class="w-full max-w-xl parchment p-4 sm:p-6 shadow-2xl flex flex-col items-center text-center pop-anim">
            <div class="w-full flex items-center justify-between border-b-2 border-woodPlank pb-2 mb-2">
              <span class="text-xs font-kanit font-extrabold text-woodDark">🌊 SUNGAI CABARAN • MISI 6</span>
              <span class="text-xs font-kanit font-bold text-amber-800">${idx + 1} / ${pool.length}</span>
              <button onclick="clearInterval(${timerInterval}); app.showScreen('map');" class="text-xs text-blue-700 underline font-bold">Peta ➔</button>
            </div>

            <!-- Pemasa Countdown Beranimasi -->
            <div class="w-16 h-16 rounded-full bg-amber-500 border-4 border-woodDark flex items-center justify-center text-2xl font-extrabold text-white shadow-lg my-1">
              <span id="speedTimerText">${timer}</span>
            </div>

            <div class="text-xs font-kanit font-bold text-slate-600 mt-1">JAWAB DENGAN PANTAS:</div>
            <div class="text-4xl sm:text-5xl font-extrabold text-woodDark my-2 tracking-wide">
              ${current.word}
            </div>

            <!-- Butang Jawapan Pantas -->
            <div class="w-full grid grid-cols-2 gap-3 mt-3">
              <button onclick="speedAnswer('AM')" class="py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 border-3 border-blue-900 text-white font-extrabold text-base shadow active:scale-95 transition">
                🟦 AM
              </button>
              <button onclick="speedAnswer('KHAS')" class="py-4 rounded-2xl bg-amber-600 hover:bg-amber-500 border-3 border-amber-900 text-white font-extrabold text-base shadow active:scale-95 transition">
                🟨 KHAS
              </button>
            </div>
          </div>
        `;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timer--;
          const el = document.getElementById('speedTimerText');
          if (el) el.textContent = timer;
          if (timer <= 0) {
            clearInterval(timerInterval);
            audioEngine.playWrong();
            idx++;
            renderQuestion();
          }
        }, 1000);

        window.speedAnswer = (choice) => {
          clearInterval(timerInterval);
          if (choice === current.cat) {
            audioEngine.playCorrect();
            const bonus = timer > 2 ? 100 : 50;
            this.addScore(bonus);
            this.addGems(1);
          } else {
            audioEngine.playWrong();
          }
          idx++;
          renderQuestion();
        };
      };

      renderQuestion();
    };

    AdventureApp.prototype.playChestChallenge = function(type) {
      const chest = GAME_DATA.misi8_chests[type];
      let qIdx = 0;
      const viewport = document.getElementById('gameViewport');

      const renderChestQ = () => {
        const item = chest.questions[qIdx];
        viewport.innerHTML = `
          <div class="w-full max-w-xl parchment p-4 sm:p-6 shadow-2xl flex flex-col items-center text-center pop-anim">
            <span class="text-3xl">${chest.icon}</span>
            <h3 class="text-lg font-extrabold text-woodDark">${chest.title}</h3>
            <p class="text-xs font-kanit text-amber-800 font-bold mb-3">Soalan ${qIdx + 1} / ${chest.questions.length}</p>

            <div class="w-full bg-white p-3 rounded-xl border-2 border-woodPlank font-kanit text-sm sm:text-base font-bold text-woodDark mb-3">
              ${item.q}
            </div>

            <div class="w-full flex flex-col gap-2">
              ${item.opt.map(o => `
                <button onclick="checkChestAns('${o}')" class="w-full py-3 rounded-xl bg-amber-50 hover:bg-amber-100 border-2 border-woodPlank font-bold text-sm text-woodDark shadow active:scale-95 transition">
                  ${o}
                </button>
              `).join('')}
            </div>

            <div id="chestMsg" class="min-h-[25px] text-xs font-kanit font-bold mt-2"></div>
          </div>
        `;

        window.checkChestAns = (ans) => {
          if (ans === item.ans) {
            audioEngine.playCorrect();
            qIdx++;
            if (qIdx < chest.questions.length) {
              renderChestQ();
            } else {
              audioEngine.playChestOpen();
              this.addGems(chest.rewardGems);
              this.badges.push(chest.rewardBadge);
              this.showModal(`TAHNIAH! ${chest.title} DIBUKA!`, chest.icon, `Kamu memperoleh +${chest.rewardGems} Permata dan Lencana [${chest.rewardBadge}]!`, 'MENUJU CABARAN AKHIR (BOSS)', () => {
                this.showScreen('misi9');
              });
            }
          } else {
            audioEngine.playWrong();
            document.getElementById('chestMsg').innerHTML = `<span class="text-rose-700">❌ Cuba lagi jawapan yang betul!</span>`;
          }
        };
      };

      renderChestQ();
    };

     * MISI 9: BOSS TERAKHIR — PENJAGA PERMATA BAHASA (10 Soalan Campuran & Perisai Tenaga)
     */
    AdventureApp.prototype.renderMisi9 = function(container) {
      let bossHp = 10;
      let qIndex = 0;
      const rounds = GAME_DATA.misi9_bossRounds;

      const renderBoss = () => {
        const item = rounds[qIndex];
        const hpPercent = Math.max(0, (bossHp / 10) * 100);

        container.innerHTML = `
          <div class="w-full max-w-xl parchment p-4 sm:p-6 shadow-2xl flex flex-col items-center text-center pop-anim">
            <div class="w-full flex items-center justify-between border-b-2 border-woodPlank pb-2 mb-2">
              <span class="text-xs font-kanit font-extrabold text-woodDark">🏰 ISTANA PERMATA • BOSS TERAKHIR</span>
              <span class="text-xs font-kanit font-bold text-rose-800">Pusingan ${qIndex + 1} / 10</span>
              <button onclick="app.showScreen('map')" class="text-xs text-blue-700 underline font-bold">Peta ➔</button>
            </div>

            <!-- Avatar Boss & Perisai Tenaga -->
            <div class="relative my-1">
              <div class="text-6xl float-rimba">🧙‍♂️</div>
              <div class="absolute -top-1 -right-2 text-2xl gem-pulse">🔮</div>
            </div>

            <h3 class="text-lg font-extrabold text-woodDark">PENJAGA PERMATA BAHASA</h3>
            
            <!-- Bar Tenaga Perisai Boss -->
            <div class="w-full bg-slate-800 h-4 rounded-full border-2 border-woodPlank overflow-hidden my-2 p-0.5">
              <div class="h-full bg-gradient-to-r from-rose-500 via-amber-400 to-emerald-400 rounded-full transition-all duration-300" style="width: ${hpPercent}%"></div>
            </div>
            <div class="text-[11px] font-kanit font-bold text-slate-600 mb-2">Perisai Ajaib Penjaga: ${bossHp} / 10</div>

            <!-- Kad Soalan Boss -->
            <div class="w-full bg-white p-3.5 rounded-2xl border-2 border-woodPlank my-1 shadow">
              <div class="text-xs font-kanit font-bold text-slate-500 uppercase">Tentukan Golongan Kata:</div>
              <div class="text-3xl sm:text-4xl font-extrabold text-woodDark my-1">${item.word}</div>
              <p class="text-xs font-kanit text-slate-600 italic">💡 Petunjuk: ${item.hint}</p>
            </div>

            <!-- Pilihan Jawapan -->
            <div class="w-full grid grid-cols-2 gap-3 mt-2">
              <button onclick="strikeBoss('AM')" class="py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-500 border-3 border-blue-900 text-white font-extrabold text-base shadow active:scale-95 transition">
                🟦 KATA NAMA AM
              </button>
              <button onclick="strikeBoss('KHAS')" class="py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 border-3 border-amber-900 text-white font-extrabold text-base shadow active:scale-95 transition">
                🟨 KATA NAMA KHAS
              </button>
            </div>

            <div id="bossMsg" class="min-h-[25px] text-xs font-kanit font-bold mt-2"></div>
          </div>
        `;

        window.strikeBoss = (type) => {
          const msg = document.getElementById('bossMsg');
          if (type === item.type) {
            audioEngine.playCorrect();
            bossHp--;
            this.addScore(120);
            this.addGems(1);
            msg.innerHTML = `<span class="text-emerald-700">⚔️ TEPAT! Perisai Penjaga berkurang!</span>`;
            qIndex++;

            if (bossHp <= 0 || qIndex >= rounds.length) {
              audioEngine.playVictory();
              this.addStars(5);
              this.badges.push('Pakar Kata Nama Rimba');
              setTimeout(() => {
                this.showScreen('victory');

              setTimeout(() => renderBoss(), 350);
            }
          } else {
            audioEngine.playWrong();
            msg.innerHTML = `<span class="text-rose-700">🛡️ Perisai menyerap serangan! Fikirkan: Umum (Am) atau Khusus (Khas)?</span>`;
          }
        };
      };

      renderBoss();
    };

  <script>
    /**
     * ANIMASI KANVAS LATAR BELAKANG: DEDALU, DAUN GUGUR & KUNANG-KUNANG RIMBA
     */
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class JungleParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = -20 - Math.random() * 50;
        this.size = Math.random() * 7 + 4;
        this.speedY = Math.random() * 0.8 + 0.3;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.6;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.isFirefly = Math.random() > 0.7;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.015) * 0.5 + this.speedX;
        this.rotation += this.rotSpeed;
        if (this.y > canvas.height + 25) {
          this.reset();
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        if (this.isFirefly) {
          ctx.fillStyle = `rgba(251, 191, 36, ${this.opacity * 0.8})`;
          ctx.beginPath();
          ctx.arc(0, 0, this.size / 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(74, 222, 128, ${this.opacity * 0.45})`;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 26; i++) {
      particles.push(new JungleParticle());
    }

    function animateAmbient() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateAmbient);
    }
    requestAnimationFrame(animateAmbient);

    // Mula aplikasi pada skrin utama
    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
